name: Verify SDK Examples

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, br_release]
  workflow_dispatch:
    inputs:
      mode:
        description: 'offline, live, or auto'
        required: true
        default: 'auto'
  schedule:
    - cron: '23 7 * * *'

jobs:
  verify-examples:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
          - platform: linux-x64
            os: ubuntu-latest
          - platform: win32-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
