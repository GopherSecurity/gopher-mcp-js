name: Verify SDK Examples

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, br_release]
  workflow_dispatch:
    inputs:
      mode:
        description: 'offline, live, or auto'
        required: true
        default: 'auto'
  schedule:
    - cron: '23 7 * * *'

jobs:
  verify-examples:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    env:
      VERIFY_EXAMPLES_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || (github.event_name == 'schedule' && 'auto' || 'offline') }}
      LLM_PROVIDER: ${{ secrets.LLM_PROVIDER || 'AnthropicProvider' }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOPHER_API_KEY: ${{ secrets.GOPHER_API_KEY }}
      GOPHER_MCP_URL: ${{ secrets.GOPHER_MCP_URL }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: darwin-arm64
            os: macos-14
          - platform: linux-x64
            os: ubuntu-latest
          - platform: win32-x64
            os: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install repo dependencies
        run: npm ci --ignore-optional

      - name: Verify examples
        shell: bash
        run: scripts/verify-examples.sh --mode "$VERIFY_EXAMPLES_MODE"
