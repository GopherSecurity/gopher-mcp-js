name: Publish Platform Packages

on:
  push:
    branches: [br_release]

permissions:
  contents: write

env:
  # SDK version is read from package.json; this native version selects gopher-orch release assets.
  GOPHER_ORCH_VERSION: 'v0.1.35'
  NPM_TAG: 'latest'
  DRY_RUN: 'false'

jobs:
  download-binaries:
    name: Download gopher-orch binaries
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_tag: ${{ steps.version.outputs.version_tag }}
      gopher_orch_version: ${{ steps.version.outputs.gopher_orch_version }}
      gopher_orch_version_tag: ${{ steps.version.outputs.gopher_orch_version_tag }}
      dry_run: ${{ steps.version.outputs.dry_run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read version from package.json
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          VERSION_TAG="v${VERSION}"
          GOPHER_ORCH_VERSION="${GOPHER_ORCH_VERSION#v}"
          GOPHER_ORCH_VERSION_TAG="v${GOPHER_ORCH_VERSION}"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_tag=${VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "gopher_orch_version=${GOPHER_ORCH_VERSION}" >> $GITHUB_OUTPUT
          echo "gopher_orch_version_tag=${GOPHER_ORCH_VERSION_TAG}" >> $GITHUB_OUTPUT
          echo "dry_run=${{ env.DRY_RUN }}" >> $GITHUB_OUTPUT
          echo "Version: ${VERSION}"
          echo "Version Tag: ${VERSION_TAG}"
          echo "gopher-orch Version: ${GOPHER_ORCH_VERSION_TAG}"

      - name: Download all release assets
        env:
          GH_TOKEN: ${{ secrets.GOPHER_ORCH_TOKEN }}
        run: |
          # Download all assets from the private gopher-orch repo
          gh release download ${{ env.GOPHER_ORCH_VERSION }} \
            -R GopherSecurity/gopher-orch \
            -D downloads

          # Extract to platform-specific directories
          mkdir -p artifacts/linux-x64 artifacts/linux-arm64
          mkdir -p artifacts/darwin-x64 artifacts/darwin-arm64
          mkdir -p artifacts/win32-x64 artifacts/win32-arm64

          tar -xzf downloads/libgopher-orch-linux-x64.tar.gz -C artifacts/linux-x64
          tar -xzf downloads/libgopher-orch-linux-arm64.tar.gz -C artifacts/linux-arm64
          tar -xzf downloads/libgopher-orch-macos-x64.tar.gz -C artifacts/darwin-x64
          tar -xzf downloads/libgopher-orch-macos-arm64.tar.gz -C artifacts/darwin-arm64
          unzip -o downloads/libgopher-orch-windows-x64.zip -d artifacts/win32-x64
          unzip -o downloads/libgopher-orch-windows-arm64.zip -d artifacts/win32-arm64

      - name: List downloaded artifacts
        run: |
          echo "=== Downloaded artifacts ==="
          find artifacts -type f \( -name "*.so" -o -name "*.dylib" -o -name "*.dll" \) | head -20

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: native-binaries
          path: artifacts/
          retention-days: 1

  publish-platform-packages:
    name: Publish ${{ matrix.platform }} package
    needs: download-binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - platform: darwin-arm64
            lib_pattern: "*.dylib"
          - platform: darwin-x64
            lib_pattern: "*.dylib"
          - platform: linux-arm64
            lib_pattern: "*.so*"
          - platform: linux-x64
            lib_pattern: "*.so*"
          - platform: win32-arm64
            lib_pattern: "*.dll"
          - platform: win32-x64
            lib_pattern: "*.dll"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: native-binaries
          path: artifacts/

      - name: Copy binaries to package
        run: |
          mkdir -p packages/${{ matrix.platform }}/lib
          # Copy library files (handle various directory structures)
          # Check lib/ directory
          if [ -d "artifacts/${{ matrix.platform }}/lib" ]; then
            cp artifacts/${{ matrix.platform }}/lib/${{ matrix.lib_pattern }} packages/${{ matrix.platform }}/lib/ 2>/dev/null || true
          fi
          # Check bin/ directory (Windows DLLs are here)
          if [ -d "artifacts/${{ matrix.platform }}/bin" ]; then
            cp artifacts/${{ matrix.platform }}/bin/${{ matrix.lib_pattern }} packages/${{ matrix.platform }}/lib/ 2>/dev/null || true
          fi
          # Check flat structure
          cp artifacts/${{ matrix.platform }}/${{ matrix.lib_pattern }} packages/${{ matrix.platform }}/lib/ 2>/dev/null || true

          # List what we copied
          echo "=== Package contents for ${{ matrix.platform }} ==="
          ls -la packages/${{ matrix.platform }}/lib/

      - name: Update package version
        run: |
          cd packages/${{ matrix.platform }}
          VERSION="${{ needs.download-binaries.outputs.gopher_orch_version }}"
          echo "Setting package version to: ${VERSION}"
          npm version "$VERSION" --no-git-tag-version --allow-same-version

      - name: Check existing npm package
        id: npm-package
        run: |
          cd packages/${{ matrix.platform }}
          PACKAGE_NAME=$(node -p "require('./package.json').name")
          VERSION="${{ needs.download-binaries.outputs.gopher_orch_version }}"
          if npm view "${PACKAGE_NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "${PACKAGE_NAME}@${VERSION} already exists; skipping native package publish"
          else
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "${PACKAGE_NAME}@${VERSION} is not published yet"
          fi

      - name: Publish to npm
        if: ${{ env.DRY_RUN != 'true' && steps.npm-package.outputs.exists != 'true' }}
        run: |
          cd packages/${{ matrix.platform }}
          npm publish --access public --tag ${{ env.NPM_TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run - show package contents
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          cd packages/${{ matrix.platform }}
          echo "=== Would publish package ==="
          cat package.json
          echo ""
          echo "=== Library files ==="
          ls -la lib/

  publish-main-package:
    name: Publish main package
    needs: [download-binaries, publish-platform-packages]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: npm install --ignore-optional

      - name: Build
        run: npm run build

      - name: Verify package version
        run: |
          VERSION="${{ needs.download-binaries.outputs.version }}"
          GOPHER_ORCH_VERSION="${{ needs.download-binaries.outputs.gopher_orch_version }}"
          PKG_VERSION=$(node -p "require('./package.json').version")

          echo "Expected version: ${VERSION}"
          echo "Package version: ${PKG_VERSION}"

          if [ "${VERSION}" != "${PKG_VERSION}" ]; then
            echo "⚠ Version mismatch! Updating package.json..."
            npm version "$VERSION" --no-git-tag-version --allow-same-version
          fi

          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            if (pkg.optionalDependencies) {
              for (const dep of Object.keys(pkg.optionalDependencies)) {
                if (dep.startsWith('@gopher.security/gopher-orch-')) {
                  pkg.optionalDependencies[dep] = '${GOPHER_ORCH_VERSION}';
                }
              }
              fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            }
          "

          echo "Final package.json:"
          cat package.json | grep -A 10 optionalDependencies

      - name: Publish to npm
        if: ${{ env.DRY_RUN != 'true' }}
        run: npm publish --access public --tag ${{ env.NPM_TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Dry run - show package info
        if: ${{ env.DRY_RUN == 'true' }}
        run: |
          echo "=== Would publish main package ==="
          cat package.json

  create-release:
    name: Create GitHub Release
    needs: [download-binaries, publish-main-package]
    runs-on: ubuntu-latest
    if: needs.download-binaries.outputs.dry_run != 'true'
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate release notes
        run: |
          VERSION="${{ needs.download-binaries.outputs.version }}"
          VERSION_TAG="${{ needs.download-binaries.outputs.version_tag }}"

          # Build Information
          cat > RELEASE_NOTES.md << EOF
          ## Build Information
          - **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          - **Commit:** ${{ github.sha }}
          - **Version:** ${VERSION}
          - **npm package:** \`@gopher.security/gopher-mcp-js@${VERSION}\`

          EOF

          # Extract What's Changed from CHANGELOG.md
          echo "## What's Changed" >> RELEASE_NOTES.md
          echo "" >> RELEASE_NOTES.md

          if [ -f "CHANGELOG.md" ]; then
            awk -v version="$VERSION" '
              $0 == "## [" version "]" || index($0, "## [" version "] - ") == 1 {
                in_section = 1
                next
              }
              in_section && /^## \[/ {
                exit
              }
              in_section {
                print
              }
            ' CHANGELOG.md | sed '/^$/N;/^\n$/D' > CHANGELOG_SECTION.md

            if [ -s CHANGELOG_SECTION.md ]; then
              cat CHANGELOG_SECTION.md >> RELEASE_NOTES.md
            else
              echo "No CHANGELOG.md entry found for ${VERSION}; listing recent commits instead." >> RELEASE_NOTES.md
              echo "" >> RELEASE_NOTES.md
              git log --pretty=format:"* %s (%h)" --no-merges -20 >> RELEASE_NOTES.md || true
            fi
          else
            echo "No CHANGELOG.md found, listing recent commits..." >> RELEASE_NOTES.md
            echo "" >> RELEASE_NOTES.md
            git log --pretty=format:"* %s (%h)" --no-merges -20 >> RELEASE_NOTES.md || true
          fi

          # Add full changelog link
          PREV_TAG=$(git tag --sort=-creatordate | grep -v "^${VERSION_TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            echo "" >> RELEASE_NOTES.md
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${VERSION_TAG}" >> RELEASE_NOTES.md
          fi

          echo ""
          echo "=== Release Notes ==="
          cat RELEASE_NOTES.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.download-binaries.outputs.version_tag }}
          name: gopher-mcp-js ${{ needs.download-binaries.outputs.version_tag }}
          body_path: RELEASE_NOTES.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
