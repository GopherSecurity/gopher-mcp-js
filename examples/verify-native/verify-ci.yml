# Copy this to .github/workflows/verify-native.yml to run on GitHub Actions
#
# Tests the published npm package on clean machines (no Homebrew, no dev tools).
# Reproduces Bug 4 (SIGKILL from invalid codesign) and Bug 5 (missing transitive deps).
#
# Trigger manually: Actions → "Verify Native Package" → Run workflow

name: Verify Native Package

on:
  workflow_dispatch:
    inputs:
      npm_version:
        description: 'npm version to test (e.g. 0.1.18, latest)'
        required: true
        default: 'latest'

jobs:
  verify-macos-arm64:
    name: macOS ARM64 (Apple Silicon)
    runs-on: macos-14
    steps:
      - name: Remove Homebrew (simulate clean machine)
        run: |
          echo "=== Removing Homebrew to simulate clean machine ==="
          sudo rm -rf /opt/homebrew /usr/local/Homebrew /usr/local/Cellar
          sudo rm -f /usr/local/bin/brew /opt/homebrew/bin/brew
          echo "Homebrew removed"

      - name: Install Node.js (without Homebrew)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install npm package
        run: |
          mkdir test-sdk && cd test-sdk
          npm init -y
          npm install @gopher.security/gopher-mcp-js@${{ inputs.npm_version }}

      - name: Verify code signatures
        run: |
          cd test-sdk/node_modules/@gopher.security/gopher-orch-darwin-arm64/lib
          echo "=== Code Signatures ==="
          FAILED=0
          for f in *.dylib; do
            if codesign -v "$f" 2>&1; then
              echo "✅ $f"
            else
              echo "❌ $f: $(codesign -v "$f" 2>&1)"
              FAILED=1
            fi
          done
          [ "$FAILED" -eq 0 ] || exit 1

      - name: Verify no Homebrew paths
        run: |
          cd test-sdk/node_modules/@gopher.security/gopher-orch-darwin-arm64/lib
          echo "=== Homebrew Path Check ==="
          for f in *.dylib; do
            [ -L "$f" ] && continue
            if otool -L "$f" | grep -qE '/usr/local/|/opt/homebrew/'; then
              echo "❌ $f has Homebrew paths:"
              otool -L "$f" | grep -E '/usr/local/|/opt/homebrew/'
              exit 1
            fi
          done
          echo "✅ No Homebrew paths"

      - name: Verify all @loader_path deps bundled
        run: |
          cd test-sdk/node_modules/@gopher.security/gopher-orch-darwin-arm64/lib
          echo "=== Dependency Check ==="
          MISSING=0
          for f in *.dylib; do
            [ -L "$f" ] && continue
            otool -L "$f" | grep "@loader_path/" | while read dep rest; do
              name=$(echo "$dep" | sed 's|@loader_path/||')
              if [ ! -f "$name" ]; then
                echo "❌ MISSING: $name (needed by $f)"
                exit 1
              fi
            done || MISSING=1
          done
          [ "$MISSING" -eq 0 ] && echo "✅ All deps bundled"

      - name: Test native loading
        run: |
          cd test-sdk
          node --input-type=module -e "
            import { GopherAgent } from '@gopher.security/gopher-mcp-js';
            console.log('✅ Import OK');
            try {
              const agent = await GopherAgent.createWithServerConfig(
                'AnthropicProvider', 'claude-haiku-4-5-20251001',
                JSON.stringify({succeeded:true,data:{servers:[{version:'2026-01-11',serverId:'1',name:'test',transport:'http_sse',config:{url:'http://localhost:1/mcp',headers:{}},connectTimeout:1000,requestTimeout:1000}]}}),
                { oauth: { mode: 'disabled' } }
              );
              console.log('✅ Agent created');
              agent.dispose();
            } catch(e) {
              if (e.message.includes('Failed to load')) {
                console.log('❌ Native load failed:', e.message);
                process.exit(1);
              }
              console.log('✅ Native loaded (got expected error:', e.message, ')');
            }
          "

  verify-macos-x64:
    name: macOS x64 (Intel)
    runs-on: macos-13
    steps:
      - name: Remove Homebrew
        run: |
          sudo rm -rf /usr/local/Homebrew /usr/local/Cellar
          sudo rm -f /usr/local/bin/brew
          echo "Homebrew removed"

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test native loading
        run: |
          mkdir test-sdk && cd test-sdk
          npm init -y
          npm install @gopher.security/gopher-mcp-js@${{ inputs.npm_version }}
          node --input-type=module -e "
            import { GopherAgent } from '@gopher.security/gopher-mcp-js';
            console.log('✅ Import OK');
            try {
              await GopherAgent.createWithServerConfig('AnthropicProvider','claude-haiku-4-5-20251001','{}');
              console.log('✅ Agent created');
            } catch(e) {
              if (e.message.includes('Failed to load')) { console.log('❌', e.message); process.exit(1); }
              console.log('✅ Native loaded');
            }
          "

  verify-linux-x64:
    name: Linux x64 (clean container)
    runs-on: ubuntu-latest
    container: node:20-slim
    steps:
      - name: Test native loading
        run: |
          mkdir test-sdk && cd test-sdk
          npm init -y
          npm install @gopher.security/gopher-mcp-js@${{ inputs.npm_version }}
          node --input-type=module -e "
            import { GopherAgent } from '@gopher.security/gopher-mcp-js';
            console.log('✅ Import OK');
            try {
              await GopherAgent.createWithServerConfig('AnthropicProvider','claude-haiku-4-5-20251001','{}');
              console.log('✅ Agent created');
            } catch(e) {
              if (e.message.includes('Failed to load')) { console.log('❌', e.message); process.exit(1); }
              console.log('✅ Native loaded');
            }
          "
